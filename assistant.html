<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Doubt Assistant | LearnLens AI</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .assistant-page {
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .assistant-container {
            width: min(850px, 100%);
            margin: auto;
        }

        .assistant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .assistant-header h1 {
            color: #3155c6;
        }

        .back-button {
            padding: 10px 18px;
            color: white;
            text-decoration: none;
            background: #3155c6;
            border-radius: 8px;
        }

        .assistant-card {
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(49, 85, 198, 0.12);
        }

        .assistant-subtitle {
            margin-bottom: 24px;
            color: #64748b;
        }

        .question-form textarea {
            width: 100%;
            min-height: 130px;
            padding: 15px;
            border: 2px solid #dbe3ff;
            border-radius: 12px;
            font: inherit;
            resize: vertical;
            box-sizing: border-box;
        }

        .question-form textarea:focus {
            border-color: #3155c6;
            outline: none;
        }

        .ask-button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #3155c6, #6d5dfc);
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .answer-box {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5ff;
            border-left: 5px solid #3155c6;
            border-radius: 10px;
        }

        .answer-box h3 {
            margin-top: 0;
            color: #3155c6;
        }

        .answer-text {
            margin-bottom: 0;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .suggestions {
            margin-top: 25px;
            color: #475569;
        }

        .suggestions span {
            display: inline-block;
            margin: 6px 4px 0 0;
            padding: 7px 11px;
            background: #eef2ff;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="assistant-page">
        <div class="assistant-container">

            <header class="assistant-header">
                <div>
                    <h1>LearnLens AI Assistant</h1>
                    <p>Ask your Python programming doubts</p>
                </div>

                <a href="{{ url_for('dashboard') }}" class="back-button">
                    Dashboard
                </a>
            </header>

            <section class="assistant-card">
                <p class="assistant-subtitle">
                    Hello {{ user_name }}! What would you like to understand?
                </p>

                <form method="POST" class="question-form">
                    <textarea
                        name="question"
                        placeholder="Example: What is a Python loop?"
                        required>{{ question or '' }}</textarea>

                    <button type="submit" class="ask-button">
                        Ask LearnLens AI
                    </button>
                </form>

                {% if answer %}
                    <div class="answer-box">
                        <h3>LearnLens AI Answer</h3>
                        <p class="answer-text">{{ answer }}</p>
                    </div>
                {% endif %}

                <div class="suggestions">
                    <strong>Try asking:</strong><br>
                    <span>What is a variable?</span>
                    <span>Explain if-else</span>
                    <span>What is a for loop?</span>
                    <span>How do functions work?</span>
                </div>
            </section>

        </div>
    </main>
</body>
</html>
